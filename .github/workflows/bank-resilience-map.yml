# Bygger og publiserer Bank Resilience Map til GitHub Pages.
# Ligger i .github/workflows/ i roten av repoet AI-prosjekter; appen ligger i mappen «Bank Resilience Map».
# Nettside: https://steinwulvik.github.io/AI-prosjekter/bank-resilience-map/
name: Bank Resilience Map – GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'Bank Resilience Map/**'
      - '.github/workflows/bank-resilience-map.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Bank Resilience Map
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Bank Resilience Map/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Appen legges i en egen undermappe, så andre statiske prosjekter kan publiseres ved siden av senere.
      - name: Sett sammen nettstedet
        run: |
          mkdir -p ../_site/bank-resilience-map
          cp -r dist/. ../_site/bank-resilience-map/
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=./bank-resilience-map/"><title>Bank Resilience Map</title><a href="./bank-resilience-map/">Bank Resilience Map</a>\n' > ../_site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}bank-resilience-map/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
